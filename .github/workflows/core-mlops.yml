name: Core MLOps

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  core-mlops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ci.txt

      - name: Validate contract (CI mode)
        run: |
          python scripts/mlops/validate_contract.py \
            --workspace storage \
            --allow-missing-artifacts \
            --skip-hashes

      - name: Export effective contract (CI mode)
        run: |
          python scripts/mlops/export_effective_contract.py \
            --workspace storage \
            --allow-missing-artifacts

      - name: Run eval harness
        run: |
          python eval/run.py \
            --dataset eval/datasets/smoke.jsonl \
            --min-recall-at-k 0.66 \
            --min-grounding-pass-rate 0.66

      - name: Run backend unit tests
        run: |
          python -m unittest \
            backend/services/raw_engine_server/test_raw_engine_server.py \
            backend/services/mlops/test_contract.py
