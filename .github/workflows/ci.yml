name: CI

on:
  push:
    branches:
      - main
      - Beta-built
  pull_request:
    branches:
      - main
      - Beta-built
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt

      - name: Install Backend CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Run Backend Unit Tests
        run: |
          python -m unittest \
            backend.services.mlops.test_contract \
            backend.services.raw_engine_server.test_raw_engine_server

      - name: Run MLOps Core Checks (CI Mode)
        run: |
          bash scripts/mlops/run_core.sh --workspace storage --allow-missing-artifacts

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: insight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: insight/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build
