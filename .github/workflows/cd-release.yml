name: CD Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt

      - name: Install Backend CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Generate Effective Contract + Eval Report
        run: |
          bash scripts/mlops/run_core.sh --workspace storage --allow-missing-artifacts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: insight/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: insight
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: insight
        run: pnpm build

      - name: Package Artifacts
        run: |
          REF="${GITHUB_REF_NAME:-manual}"
          mkdir -p release
          tar -C insight -czf "release/insight-frontend-dist-${REF}.tar.gz" dist
          tar -C storage -czf "release/effective-contract-${REF}.tar.gz" contracts/effective_contract_latest.json

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
