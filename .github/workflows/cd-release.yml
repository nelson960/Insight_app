name: CD Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (example: 0.1.0)"
        required: false
        type: string

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install Backend CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Run Backend Unit Tests
        run: |
          python -m unittest \
            backend.services.mlops.test_contract \
            backend.services.raw_engine_server.test_raw_engine_server

      - name: Run MLOps Core Checks (CI Mode)
        run: |
          bash scripts/mlops/run_core.sh --workspace storage --allow-missing-artifacts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: insight/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: insight
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: insight
        run: pnpm build

  build-and-package:
    name: Build macOS arm64 Package
    needs: test
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt pyinstaller uvicorn onnxruntime tokenizers llama-cpp-python huggingface_hub numpy pandas aiofiles python-multipart requests certifi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: insight/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Onedir App (unsigned)
        run: |
          bash scripts/build_onedir_prod.sh --no-sign --no-smoketest

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./insight/package.json').version")"
          TAG_VERSION=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          VERSION="$PKG_VERSION"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          fi
          if [[ -n "$TAG_VERSION" ]]; then
            VERSION="$TAG_VERSION"
          fi
          if [[ -n "$TAG_VERSION" && "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match insight/package.json version ($PKG_VERSION)." >&2
            exit 1
          fi
          ZIP_NAME="Insight-v${VERSION}-macOS-arm64.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION zip=$ZIP_NAME"

      - name: Package Zip Artifact
        run: |
          mkdir -p release/package
          cp -R dist/onedir/Insight.app release/package/
          if [[ -f dist/onedir/README.txt ]]; then
            cp dist/onedir/README.txt release/package/
          fi
          cd release
          ditto -c -k --sequesterRsrc --keepParent package "${{ steps.meta.outputs.zip_name }}"
          shasum -a 256 "${{ steps.meta.outputs.zip_name }}" > "${{ steps.meta.outputs.zip_name }}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insight-macos-arm64
          path: |
            release/${{ steps.meta.outputs.zip_name }}
            release/${{ steps.meta.outputs.zip_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: insight-macos-arm64
          path: release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ needs.build-and-package.outputs.zip_name }}
            release/${{ needs.build-and-package.outputs.zip_name }}.sha256
          generate_release_notes: true
